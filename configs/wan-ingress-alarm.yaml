version: "1"

# The lab's monitor for the WAN front. Run with:
#   ocd-smoke-alarm serve -config configs/wan-ingress-alarm.yaml
# Edit the endpoint to match the ingress listener. The target declares
# ingress/forward: the ingress advertises that family only once agreed traffic
# has actually crossed the border. Until then the alarm reads degraded and adhd
# renders yellow; a dead process reads unhealthy/red.
service:
  name: "wan-ingress-alarm"
  environment: "lab"
  mode: "foreground"
  log_level: "info"
  poll_interval: "10s"
  timeout: "5s"
  max_workers: 4

health:
  enabled: true
  listen_addr: "127.0.0.1:18099"
  endpoints:
    healthz: "/healthz"
    readyz: "/readyz"
    status: "/status"

runtime:
  state_dir: "state"
  event_history_size: 200
  graceful_shutdown_timeout: "5s"

discovery:
  enabled: false

alerts:
  aggressive: false
  notify_on_regression_immediately: true
  severity:
    healthy: "info"
    degraded: "warn"
    regression: "error"
    outage: "critical"
  sinks:
    log:
      enabled: true

targets:
  - id: "wan-ingress"
    enabled: true
    protocol: "mcp"
    name: "WAN Ingress"
    endpoint: "http://127.0.0.1:8443/mcp"
    transport: "http"
    expected:
      healthy_status_codes: [200]
      min_capabilities:
        - "ingress/forward"
    auth:
      type: "none"
    check:
      interval: "10s"
      timeout: "5s"
      retries: 1
      handshake_profile: "base"
      required_methods:
        - "initialize"
        - "ingress/status"

known_state:
  enabled: true
  persist: false
  sustain_success_before_mark_healthy: 1
  classify_new_failures_after_healthy_as: "regression"
  outage_threshold_consecutive_failures: 2
